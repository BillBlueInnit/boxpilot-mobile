# A guided tour of the real app for CI: imports a subscription through a
# provider-style link, then walks the pages in light and dark. Screenshots
# land in the folder Maestro runs in.
#
#   maestro test -e IMPORT_LINK='boxpilot://install-config?url=…&name=CI%20Test' .maestro/tour.yaml
appId: io.github.billblueinnit.boxpilot
---
- launchApp
# Slow CI emulators can pop a system ANR dialog (e.g. Pixel Launcher isn't
# responding) over the app right after boot; dismiss it if present.
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          text: 'Close app'
          optional: true
      - tapOn:
          text: 'Wait'
          optional: true
- extendedWaitUntil:
    visible: 'Tools'
    timeout: 90000
- takeScreenshot: 01_home_empty

# With VPN permission already granted (as in CI), "Connect on launch" would
# connect as soon as the first nodes arrive. The tour looks at the pages
# offline; connect.yaml connects.
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: 'Settings'
      - tapOn: 'Connect on launch'
      - tapOn: 'Home'

# Android tests a provider's one-tap import link; iOS opens the same form from
# the dashboard (iOS 26's SpringBoard "Open in BoxPilot?" prompt rejects
# synthetic XCUITest taps on the simulator).
- runFlow:
    when:
      platform: Android
    commands:
      - openLink: ${IMPORT_LINK}
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: 'add-first'
      - extendedWaitUntil:
          visible:
            id: 'subscription-url'
          timeout: 30000
      - tapOn:
          id: 'subscription-url'
      - inputText: ${SUB_URL}
      - tapOn:
          id: 'subscription-name'
      - inputText: 'CI Test'
- extendedWaitUntil:
    visible:
      id: 'subscription-name'
    timeout: 30000
- takeScreenshot: 02_import_editor
- tapOn: 'Add'
- extendedWaitUntil:
    visible: '.*nodes ready.*'
    timeout: 60000
- takeScreenshot: 03_home_ready
- scrollUntilVisible:
    element: 'Logs'
    direction: DOWN
- takeScreenshot: 04_home_scrolled

- tapOn: 'Subscriptions'
- assertVisible:
    id: 'subscription-CI Test'
- takeScreenshot: 05_subscriptions
- tapOn:
    id: 'subscription-CI Test'
- extendedWaitUntil:
    visible: '.*CI Node.*'
    timeout: 20000
- takeScreenshot: 06_subscription_detail
- runFlow: back.yaml

- tapOn: 'Proxies'
- assertVisible: 'Not connected'
- takeScreenshot: 07_proxies_offline

- tapOn: 'Settings'
- assertVisible:
    id: 'setting-language'
- takeScreenshot: 08_settings
- scrollUntilVisible:
    element: 'Version'
    direction: DOWN
- takeScreenshot: 09_settings_end

# Rules, pushed from Settings.
- scrollUntilVisible:
    element:
      id: 'setting-rules'
    direction: UP
    centerElement: true
- tapOn:
    id: 'setting-rules'
- extendedWaitUntil:
    visible: 'One-click setups'
    timeout: 20000
- takeScreenshot: 10_rules
- scrollUntilVisible:
    element:
      id: 'custom-rules'
    direction: DOWN
    centerElement: true
- tapOn:
    id: 'custom-rules'
- extendedWaitUntil:
    visible: 'Visual'
    timeout: 15000
- takeScreenshot: 10b_custom_rules
- runFlow: back.yaml
- scrollUntilVisible:
    element:
      id: 'service-library'
    direction: DOWN
    centerElement: true
- tapOn:
    id: 'service-library'
- extendedWaitUntil:
    visible: 'Popular services'
    timeout: 15000
- takeScreenshot: 10c_service_library
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: 'Close'
- runFlow: back.yaml

# The app's own theme setting, independent of the system's.
- scrollUntilVisible:
    element:
      id: 'setting-theme'
    direction: UP
    centerElement: true
- tapOn:
    id: 'setting-theme'
- tapOn: 'Dark'
- takeScreenshot: 11_settings_dark
- tapOn: 'Home'
- takeScreenshot: 12_home_dark
- tapOn: 'Settings'
- tapOn:
    id: 'setting-theme'
- tapOn: 'Light'
- tapOn: 'Home'
