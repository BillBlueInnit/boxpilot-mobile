name: Build

on:
  push:
    branches: [main, react-native]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: '24'
  SING_BOX_VERSION: v1.14.4
  GO_VERSION: '1.25'
  NDK_VERSION: 28.2.13676358
  # Above every build of the Flutter app, so a release updates it in place.
  BUILD_NUMBER: ${{ github.run_number }}00
  CI: '1'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Check the Rust bridge
        run: cargo check --manifest-path rust/Cargo.toml

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: android
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - name: Install NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Cache libbox
        id: libbox
        uses: actions/cache@v4
        with:
          path: modules/boxpilot-core/android/libs/libbox.aar
          key: libbox-android-${{ env.SING_BOX_VERSION }}-${{ hashFiles('scripts/build_libbox.sh') }}
      - name: Build libbox
        if: steps.libbox.outputs.cache-hit != 'true'
        run: bash scripts/build_libbox.sh android
      - name: Build the Rust bridge
        run: bash scripts/build_rust.sh android
      - run: npm ci
      - name: Release keystore
        env:
          KEYSTORE: ${{ secrets.BOXPILOT_KEYSTORE_BASE64 }}
        if: env.KEYSTORE != ''
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "BOXPILOT_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install
      - name: Build APKs
        env:
          BOXPILOT_KEYSTORE_PASSWORD: ${{ secrets.BOXPILOT_KEYSTORE_PASSWORD }}
          BOXPILOT_KEY_ALIAS: ${{ secrets.BOXPILOT_KEY_ALIAS }}
          BOXPILOT_KEY_PASSWORD: ${{ secrets.BOXPILOT_KEY_PASSWORD }}
          NODE_ENV: production
        # One APK per ABI (most phones want arm64-v8a); a universal APK would carry three cores.
        run: |
          (cd android && ./gradlew assembleRelease --console=plain)
          mkdir -p dist
          version=$(node -p "require('./app.json').expo.version")
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "android/app/build/outputs/apk/release/app-$abi-release.apk" "dist/BoxPilot-$version-android-$abi.apk"
          done
          ls -la dist
      # Only APKs signed with the release key are published; a debug-signed
      # APK could never be updated by a later, properly signed one.
      - uses: actions/upload-artifact@v4
        if: env.BOXPILOT_KEYSTORE_FILE != ''
        with:
          name: android
          path: dist/*.apk
      - uses: actions/upload-artifact@v4
        if: env.BOXPILOT_KEYSTORE_FILE == ''
        with:
          name: android-debug-signed
          path: dist/*.apk

  ios:
    needs: test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: ios
      - name: Cache libbox
        id: libbox
        uses: actions/cache@v4
        with:
          path: native/ios/Libbox.xcframework
          key: libbox-ios-${{ env.SING_BOX_VERSION }}-${{ hashFiles('scripts/build_libbox.sh') }}
      - name: Build libbox
        if: steps.libbox.outputs.cache-hit != 'true'
        env:
          LIBBOX_APPLE_TARGETS: ios
        run: bash scripts/build_libbox.sh apple
      - name: Build the Rust bridge
        env:
          RUST_IOS_TARGETS: aarch64-apple-ios
        run: bash scripts/build_rust.sh ios
      - run: npm ci
      - name: Generate the iOS project
        run: npx expo prebuild --platform ios
      - name: Add the PacketTunnel extension
        run: |
          gem list -i xcodeproj > /dev/null || sudo gem install xcodeproj
          ruby native/ios/add_packet_tunnel.rb
      - name: Build unsigned IPA
        env:
          NODE_ENV: production
        run: |
          set -o pipefail
          xcodebuild -workspace ios/BoxPilot.xcworkspace -scheme BoxPilot -configuration Release \
            -sdk iphoneos -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log | grep -E "^(error|warning: unable|\*\*|▸|/.*error:)|error:" || true
          test -d build/ios/Build/Products/Release-iphoneos/BoxPilot.app
          version=$(node -p "require('./app.json').expo.version")
          mkdir -p dist/Payload
          cp -R build/ios/Build/Products/Release-iphoneos/BoxPilot.app dist/Payload/
          (cd dist && zip -qry "BoxPilot-$version-ios-unsigned.ipa" Payload && rm -rf Payload)
          ls -la dist
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-build-log
          path: xcodebuild.log
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: dist/*.ipa

  # The real app on an Android emulator: every page in light and dark, then a
  # VPN connection through a test node on this runner, with screenshots.
  ui-android:
    needs: test
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: android-x86_64
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - name: Install NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Cache libbox
        id: libbox
        uses: actions/cache@v4
        with:
          path: modules/boxpilot-core/android/libs/libbox.aar
          key: libbox-android-${{ env.SING_BOX_VERSION }}-${{ hashFiles('scripts/build_libbox.sh') }}
      - name: Build libbox
        if: steps.libbox.outputs.cache-hit != 'true'
        run: bash scripts/build_libbox.sh android
      - name: Build the Rust bridge
        env:
          RUST_ANDROID_ABIS: x86_64
        run: bash scripts/build_rust.sh android
      - run: npm ci
      - name: Build the APK
        env:
          NODE_ENV: production
        run: |
          npx expo prebuild --platform android --no-install
          (cd android && ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --console=plain)
      - name: Install Maestro
        run: curl -fsSL "https://get.maestro.mobile.dev" | bash
      - name: Test node
        run: |
          curl -sL "https://github.com/SagerNet/sing-box/releases/download/$SING_BOX_VERSION/sing-box-${SING_BOX_VERSION#v}-linux-amd64.tar.gz" | tar xz
          pw=$(openssl rand -base64 16)
          printf '{"log":{"level":"info"},"inbounds":[{"type":"shadowsocks","listen":"0.0.0.0","listen_port":18388,"method":"2022-blake3-aes-128-gcm","password":"%s"}],"outbounds":[{"type":"direct"}]}' "$pw" > server.json
          nohup ./sing-box-*/sing-box run -c server.json > sing-box-server.log 2>&1 &
          user=$(printf '%s' "2022-blake3-aes-128-gcm:$pw" | base64 -w0 | tr '+/' '-_' | tr -d '=')
          echo "BOXPILOT_TEST_NODE=ss://$user@10.0.2.2:18388#CI%20Node%20US" >> "$GITHUB_ENV"
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: bash scripts/ci_ui_test.sh android android/app/build/outputs/apk/release/app-x86_64-release.apk screenshots/android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-android
          path: |
            screenshots/android
            sing-box-server.log

  # The real app on an iOS 26 simulator, native bars included. The simulator
  # cannot run a packet tunnel, so this covers the UI only.
  ui-ios:
    needs: test
    timeout-minutes: 60
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: ios-sim
      - name: Build the Rust bridge
        env:
          RUST_IOS_TARGETS: aarch64-apple-ios-sim
        run: bash scripts/build_rust.sh ios
      - run: npm ci
      - name: Generate the iOS project
        run: npx expo prebuild --platform ios
      - name: Boot a simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          phones = [d for runtime, ds in sorted(devices.items(), reverse=True) if "iOS-26" in runtime for d in ds if d["name"].startswith("iPhone")]
          print(phones[0]["udid"])')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          # The first keyboard would otherwise open the swipe-typing tip over the screenshots.
          xcrun simctl spawn "$udid" defaults write com.apple.Preferences DidShowContinuousPathIntroduction -bool true || true
          xcrun simctl status_bar "$udid" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          echo "SIM=$udid" >> "$GITHUB_ENV"
      - name: Build for the simulator
        env:
          NODE_ENV: production
        run: |
          set -o pipefail
          xcodebuild -workspace ios/BoxPilot.xcworkspace -scheme BoxPilot -configuration Release \
            -sdk iphonesimulator -destination "id=$SIM" -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO build | tee xcodebuild.log | grep -E "error:|\*\*" || true
          test -d build/ios/Build/Products/Release-iphonesimulator/BoxPilot.app
          xcrun simctl install "$SIM" build/ios/Build/Products/Release-iphonesimulator/BoxPilot.app
      - name: Install Maestro
        run: curl -fsSL "https://get.maestro.mobile.dev" | bash
      - run: bash scripts/ci_ui_test.sh ios "$SIM" screenshots/ios
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-ios
          path: |
            screenshots/ios
            xcodebuild.log

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '{android,ios}'
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
