name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.8
  SING_BOX_VERSION: v1.14.4
  GO_VERSION: '1.25'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Install NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" > /dev/null
      - name: Cache libbox
        id: libbox
        uses: actions/cache@v4
        with:
          path: android/app/libs/libbox.aar
          key: libbox-android-${{ env.SING_BOX_VERSION }}-${{ hashFiles('scripts/build_libbox.sh') }}
      - name: Build libbox
        if: steps.libbox.outputs.cache-hit != 'true'
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358" bash scripts/build_libbox.sh android
      - name: Release keystore
        env:
          KEYSTORE: ${{ secrets.BOXPILOT_KEYSTORE_BASE64 }}
        if: env.KEYSTORE != ''
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "BOXPILOT_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build APKs
        env:
          BOXPILOT_KEYSTORE_PASSWORD: ${{ secrets.BOXPILOT_KEYSTORE_PASSWORD }}
          BOXPILOT_KEY_ALIAS: ${{ secrets.BOXPILOT_KEY_ALIAS }}
          BOXPILOT_KEY_PASSWORD: ${{ secrets.BOXPILOT_KEY_PASSWORD }}
        # One APK per ABI (most phones want arm64-v8a); a universal APK would carry three cores.
        run: |
          flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols --build-number=${{ github.run_number }}
          mkdir -p dist
          version=$(grep '^version:' pubspec.yaml | sed -E 's/version: ([^+]+).*/\1/')
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "dist/BoxPilot-$version-android-$abi.apk"
          done
      # Only APKs signed with the release key are published; a debug-signed
      # APK could never be updated by a later, properly signed one.
      - uses: actions/upload-artifact@v4
        if: env.BOXPILOT_KEYSTORE_FILE != ''
        with:
          name: android
          path: dist/*.apk
      - uses: actions/upload-artifact@v4
        if: env.BOXPILOT_KEYSTORE_FILE == ''
        with:
          name: android-debug-signed
          path: dist/*.apk

  ios:
    needs: test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Cache libbox
        id: libbox
        uses: actions/cache@v4
        with:
          path: ios/Libbox.xcframework
          key: libbox-ios-${{ env.SING_BOX_VERSION }}-${{ hashFiles('scripts/build_libbox.sh') }}
      - name: Build libbox
        if: steps.libbox.outputs.cache-hit != 'true'
        env:
          LIBBOX_APPLE_TARGETS: ios
        run: bash scripts/build_libbox.sh apple
      - name: Add the PacketTunnel extension
        run: |
          gem list -i xcodeproj > /dev/null || sudo gem install xcodeproj
          ruby ios/scripts/add_packet_tunnel.rb
      - name: Build unsigned IPA
        run: |
          flutter build ios --release --no-codesign --obfuscate --split-debug-info=build/symbols --build-number=${{ github.run_number }}
          version=$(grep '^version:' pubspec.yaml | sed -E 's/version: ([^+]+).*/\1/')
          mkdir -p dist/Payload
          cp -R build/ios/iphoneos/Runner.app dist/Payload/
          (cd dist && zip -qry "BoxPilot-$version-ios-unsigned.ipa" Payload && rm -rf Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: dist/*.ipa

  # The real app on an Android emulator: every page in light and dark, then a
  # VPN connection through a test node on this runner, with screenshots.
  ui-android:
    needs: test
    timeout-minutes: 50
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Install NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" > /dev/null
      - name: Cache libbox
        id: libbox
        uses: actions/cache@v4
        with:
          path: android/app/libs/libbox.aar
          key: libbox-android-${{ env.SING_BOX_VERSION }}-${{ hashFiles('scripts/build_libbox.sh') }}
      - name: Build libbox
        if: steps.libbox.outputs.cache-hit != 'true'
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358" bash scripts/build_libbox.sh android
      - name: Test node
        run: |
          curl -sL "https://github.com/SagerNet/sing-box/releases/download/$SING_BOX_VERSION/sing-box-${SING_BOX_VERSION#v}-linux-amd64.tar.gz" | tar xz
          pw=$(openssl rand -base64 16)
          printf '{"log":{"level":"info"},"inbounds":[{"type":"shadowsocks","listen":"127.0.0.1","listen_port":18388,"method":"2022-blake3-aes-128-gcm","password":"%s"}],"outbounds":[{"type":"direct"}]}' "$pw" > server.json
          nohup ./sing-box-*/sing-box run -c server.json > sing-box-server.log 2>&1 &
          user=$(printf '%s' "2022-blake3-aes-128-gcm:$pw" | base64 -w0 | tr '+/' '-_' | tr -d '=')
          echo "BOXPILOT_TEST_NODE=ss://$user@10.0.2.2:18388#CI%20Node%20US" >> "$GITHUB_ENV"
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: bash scripts/ci_ui_test.sh android emulator-5554 screenshots/android --dart-define=BOXPILOT_TEST_NODE=${{ env.BOXPILOT_TEST_NODE }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-android
          path: |
            screenshots/android
            sing-box-server.log

  # The real app on an iOS 26 simulator (native Liquid Glass bars included). The
  # simulator cannot run a packet tunnel, so this covers the UI only.
  ui-ios:
    needs: test
    timeout-minutes: 50
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Boot a simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          phones = [d for runtime, ds in sorted(devices.items(), reverse=True) if "iOS-26" in runtime for d in ds if d["name"].startswith("iPhone")]
          print(phones[0]["udid"])')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          # The first keyboard would otherwise open the swipe-typing tip over the screenshots.
          xcrun simctl spawn "$udid" defaults write com.apple.Preferences DidShowContinuousPathIntroduction -bool true || true
          xcrun simctl status_bar "$udid" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          echo "SIM=$udid" >> "$GITHUB_ENV"
      - run: bash scripts/ci_ui_test.sh ios "$SIM" screenshots/ios
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-ios
          path: screenshots/ios

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '{android,ios}'
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
