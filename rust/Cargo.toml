[package]
name = "boxpilot_bridge"
version = "0.2.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
# Android loads the shared library; iOS links the static one.
crate-type = ["cdylib", "staticlib"]

[dependencies]
# The desktop app's core, unchanged: converter, config generator, engine.
# Local checkouts override this with a path in .cargo/config.toml (see README).
boxpilot-core = { git = "https://github.com/BillBlueInnit/boxpilot", rev = "61c64ccdcb4ec197fbb4d5c27798aa75df3272f2" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
log = "0.4"
futures-util = "0.3"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
jni = "0.21"

[target.'cfg(target_os = "ios")'.dependencies]
oslog = "0.2"

[profile.release]
# Size over speed: the bridge does bookkeeping, not packet work (that is libbox).
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
