[package]
name = "boxpilot_bridge"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
# The desktop app's core, unchanged: converter, config generator, engine.
# Local checkouts override this with a path in .cargo/config.toml (see README).
boxpilot-core = { git = "https://github.com/BillBlueInnit/boxpilot", rev = "d661e1f9c3cff512e945edecd64cde6f2a0c2fcc" }
anyhow = "1"
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
log = "0.4"
futures-util = "0.3"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"

[target.'cfg(target_os = "ios")'.dependencies]
oslog = "0.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[profile.release]
# Size over speed: the bridge does bookkeeping, not packet work (that is libbox).
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
